apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker-cpu
  labels:
    app: inference-worker
    tier: cpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-worker
      tier: cpu
  template:
    metadata:
      labels:
        app: inference-worker
        tier: cpu
    spec:
      containers:
      - name: worker
        image: ai-inference-platform/worker:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: WORKER_DEVICE
          value: "cpu"
        - name: DATABASE_URL
          value: "postgresql://user:password@postgres-service:5432/inference"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        resources:
          limits:
            cpu: "4000m"
            memory: "4Gi"
          requests:
            cpu: "1000m"
            memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker-gpu
  labels:
    app: inference-worker
    tier: gpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-worker
      tier: gpu
  template:
    metadata:
      labels:
        app: inference-worker
        tier: gpu
    spec:
      containers:
      - name: worker
        image: ai-inference-platform/worker:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: WORKER_DEVICE
          value: "gpu"
        - name: DATABASE_URL
          value: "postgresql://user:password@postgres-service:5432/inference"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "8000m"
            memory: "16Gi"
          requests:
            nvidia.com/gpu: 1
            cpu: "2000m"
            memory: "8Gi"
